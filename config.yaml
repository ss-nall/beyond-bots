# BeyondBots Configuration

# X search queries / hashtags to monitor
queries:
  - "#bollywood"
  - "#tollywood"
  - "#kollywood"
  - "#movies"

# Models configured for NLP stages
model_names:
  dense_embeddings: "google/muril-base-cased"
  sentiment_model: "cardiffnlp/twitter-xlm-roberta-base-sentiment"
  anthropic_model: "claude-3-5-sonnet-20241022"  # Fallback: "claude-sonnet-4-6"

# Scoping constraints
collection_settings:
  max_posts_per_query: 100
  time_filter: "all"  # Options: all, year, month, week, day
  input_file: "data/Animal_synthetic_x_posts.csv"       # If specified (e.g. "./data/raw/reviews.csv"), parses local reviews instead of calling X API

