[project]
name = "beyondbots"
version = "0.1.0"
description = "Text mining pipeline to detect coordinated social media discourse around Indian film releases on Reddit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "praw>=7.7.1",
    "indic-nlp-library>=0.92",
    "spacy>=3.7.2",
    "scikit-learn>=1.3.2",
    "transformers>=4.35.2",
    "sentence-transformers>=2.2.2",
    "hdbscan>=0.8.33",
    "networkx>=3.2.1",
    "igraph>=0.11.3",
    "leidenalg>=0.10.1",
    "gensim>=4.3.2",
    "bertopic>=0.16.0",
    "anthropic>=0.8.1",
    "shap>=0.43.0",
    "pandas>=2.1.3",
    "pyarrow>=14.0.1",
    "pytest>=7.4.3",
    "emoji>=2.8.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

